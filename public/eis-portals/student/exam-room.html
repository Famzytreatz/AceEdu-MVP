<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Exam | AceEdu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      :root {
        --danger: #ef4444;
        --success: #4ade80;
        --bg-body: #020617;
        --bg-surface: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f1f5f9;
        --text-secondary: #94a3b8;
        --gold: #d4af37;
      }

      body {
        background: var(--bg-body);
        color: var(--text-main);
        font-family: "Plus Jakarta Sans", sans-serif;
        margin: 0;
        overflow: hidden;
        user-select: none; /* Prevents highlighting text */
      }

      /* THE TOP LOCK BAR */
      .exam-header {
        background: var(--bg-surface);
        padding: 15px 40px;
        border-bottom: 2px solid var(--danger);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .exam-title h3 {
        margin: 0;
        font-family: "Outfit", sans-serif;
        font-size: 1.2rem;
      }
      .timer-box {
        background: var(--danger);
        padding: 5px 20px;
        border-radius: 5px;
        font-weight: 800;
        font-size: 20px;
        color: white;
      }

      /* THE EXAM WORKSPACE */
      .exam-container {
        display: grid;
        grid-template-columns: 1fr 300px;
        height: calc(100vh - 70px);
      }

      .question-area {
        padding: 30px;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.02);
      }
      .q-card {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 20px;
        border-left: 5px solid var(--gold);
      }
      .q-card p {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 10px;
      }
      .q-card h2 {
        font-family: "Outfit", sans-serif;
        font-size: 1.3rem;
        margin-top: 0;
        margin-bottom: 20px;
      }
      .options label {
        display: block;
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 15px;
        margin-bottom: 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        border: 1px solid transparent;
      }
      .options label:hover {
        background: rgba(212, 175, 55, 0.1);
        border-color: var(--gold);
      }
      .options input[type="radio"] {
        margin-right: 10px;
        accent-color: var(--gold);
      }

      .submit-btn {
        background: var(--gold);
        color: var(--bg-body);
        padding: 15px 40px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        font-size: 1rem;
      }
      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
      }

      .options label.correct-answer {
        background: rgba(74, 222, 128, 0.1);
        border-color: var(--success);
      }
      .options label.wrong-answer {
        background: rgba(239, 68, 68, 0.1);
        border-color: var(--danger);
      }

      /* STUDENT SIDEBAR MONITOR */
      .monitor-sidebar {
        background: var(--bg-surface);
        padding: 20px;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
      }
      .monitor-photo {
        width: 100%;
        height: 150px;
        border: 2px solid var(--gold);
        border-radius: 10px;
        object-fit: cover;
        margin-bottom: 15px;
      }
      .monitor-sidebar h4 {
        margin-top: 0;
        margin-bottom: 5px;
        color: var(--text-main);
      }
      .monitor-sidebar p {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 15px;
      }
      .security-log small {
        color: var(--text-secondary);
        font-size: 0.8rem;
        display: block;
        margin-bottom: 10px;
      }
      .status-badge {
        color: var(--success);
        font-size: 0.8rem;
        margin-top: 5px;
        display: block;
      }
      .status-badge i {
        font-size: 8px;
        margin-right: 5px;
      }

      /* Message Box */
      .message-box {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        margin: 50px auto;
        max-width: 600px;
        border: 1px solid var(--gold);
      }
      .message-box h1 {
        color: var(--gold);
        font-family: "Outfit", sans-serif;
        font-size: 2rem;
      }
      .message-box p {
        font-size: 1.1rem;
        color: var(--text-secondary);
      }
      .message-box .btn {
        background: var(--gold);
        color: var(--bg-body);
        padding: 10px 25px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
        text-decoration: none;
        display: inline-block;
      }

      @media (max-width: 768px) {
        .exam-container {
          grid-template-columns: 1fr;
          height: calc(
            100vh - 120px
          ); /* Adjust for header and potential footer */
        }
        .monitor-sidebar {
          display: none; /* Hide sidebar on small screens */
        }
        .exam-header {
          padding: 10px 20px;
        }
        .exam-title h3 {
          font-size: 1rem;
        }
        .timer-box {
          font-size: 1rem;
          padding: 3px 10px;
        }
        .question-area {
          padding: 20px;
        }
        .q-card h2 {
          font-size: 1.1rem;
        }
        .submit-btn {
          width: 100%;
        }
      }
    
/* AceEdu Exam Experience — visual layer only; existing IDs and exam logic retained. */
:root{--danger:#f87171;--success:#34d399;--bg-body:#070b18;--bg-surface:rgba(13,20,40,.92);--card-bg:rgba(20,30,55,.82);--text-main:#eef4ff;--text-secondary:#9aabc8;--gold:#8b9cff;--exam-cyan:#42e8d4;--line:rgba(148,163,220,.16)}
*{box-sizing:border-box}html{min-height:100%;background:#070b18}body{min-height:100vh;background:radial-gradient(ellipse at 15% 0%,rgba(74,91,205,.22),transparent 38%),radial-gradient(ellipse at 88% 24%,rgba(40,206,198,.11),transparent 34%),#070b18;color:var(--text-main);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden;user-select:auto;line-height:1.55}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(145,164,226,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(145,164,226,.1) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 85%);z-index:0}
#exam-list-wrapper,#exam-wrapper,#exam-message,#exam-results{position:relative;z-index:1;animation:examFadeUp .55s cubic-bezier(.2,.75,.25,1) both}
.exam-header{position:sticky;top:0;z-index:20;min-height:84px;padding:18px clamp(18px,4vw,54px);gap:18px;background:rgba(9,14,30,.84);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid rgba(128,151,255,.24);box-shadow:0 12px 40px rgba(0,0,0,.18)}.exam-title h3{font-family:'Outfit',sans-serif;font-size:clamp(1.1rem,2vw,1.45rem);font-weight:700;letter-spacing:-.035em;color:#f6f8ff}.exam-title span{display:inline-flex;margin-top:5px;padding:3px 9px;border-radius:999px;background:rgba(139,156,255,.12);color:#b9c5ff!important;font-size:.72rem;letter-spacing:.05em}.exam-header a{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);transition:transform .22s,border-color .22s,background .22s}.exam-header a:hover{transform:translateY(-2px);border-color:rgba(139,156,255,.55);background:rgba(139,156,255,.1)}
.timer-box{min-width:112px;text-align:center;padding:10px 18px;border:1px solid rgba(248,113,113,.35);border-radius:15px;background:linear-gradient(135deg,rgba(248,113,113,.2),rgba(248,113,113,.07));color:#ffd7dc;box-shadow:0 0 28px rgba(248,113,113,.1);font:800 1.2rem 'Outfit',sans-serif;font-variant-numeric:tabular-nums;animation:timerPulse 3s ease-in-out infinite}
.exam-container{height:auto;min-height:calc(100vh - 84px);grid-template-columns:minmax(0,1fr) 290px;gap:22px;padding:24px clamp(16px,3.4vw,48px) 38px;align-items:start}.question-area{min-width:0;padding:clamp(12px,2vw,28px);border:1px solid var(--line);border-radius:24px;background:rgba(12,18,36,.62);box-shadow:0 24px 80px rgba(0,0,0,.16);overflow:visible}.q-card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(26,38,70,.92),rgba(15,23,44,.92));border:1px solid rgba(142,159,255,.2);border-left:3px solid #8294ff;border-radius:20px;padding:clamp(20px,3vw,34px);margin-bottom:18px;box-shadow:0 12px 34px rgba(0,0,0,.12);animation:examFadeUp .45s both}.q-card:before{content:"";position:absolute;width:180px;height:180px;right:-110px;top:-120px;border-radius:50%;background:rgba(66,232,212,.09);filter:blur(5px);pointer-events:none}.q-card p{color:#9caed1;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.q-card h2{font-size:clamp(1.08rem,2vw,1.35rem);line-height:1.6;color:#f3f6ff;font-weight:650}.options{display:grid;gap:10px}.options label{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border:1px solid rgba(157,173,222,.14);border-radius:13px;background:rgba(255,255,255,.035);color:#dbe5fa;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}.options label:hover{transform:translateX(3px);background:rgba(139,156,255,.09);border-color:rgba(139,156,255,.52);box-shadow:0 8px 24px rgba(0,0,0,.12)}.options input[type=radio]{margin-top:4px;accent-color:#9aa8ff;flex:0 0 auto}.options label:has(input:checked){background:rgba(139,156,255,.13);border-color:#8b9cff;box-shadow:inset 0 0 0 1px rgba(139,156,255,.14)}.options label.correct-answer{background:rgba(52,211,153,.1);border-color:#34d399}.options label.wrong-answer{background:rgba(248,113,113,.1);border-color:#f87171}
.submit-btn,.message-box .btn{position:relative;overflow:hidden;border:1px solid rgba(178,188,255,.3);border-radius:13px;padding:14px 22px;background:linear-gradient(110deg,#8b9cff,#7b87ef 55%,#42cfc8);color:#081025;font-size:.88rem;font-weight:800;letter-spacing:.035em;box-shadow:0 12px 30px rgba(105,125,240,.2);transition:transform .22s,box-shadow .22s,filter .22s}.submit-btn:after{content:"";position:absolute;top:-40%;left:-50%;width:30%;height:180%;background:rgba(255,255,255,.32);transform:rotate(25deg);transition:left .55s}.submit-btn:hover,.message-box .btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(105,125,240,.3);filter:saturate(1.1)}.submit-btn:hover:after{left:130%}#submit-exam-btn{margin:8px 0 6px;width:auto;min-width:240px}
.monitor-sidebar{position:sticky;top:108px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(20,30,58,.92),rgba(10,16,32,.92));box-shadow:0 22px 60px rgba(0,0,0,.18)}.monitor-photo{height:140px;width:140px;display:block;margin:0 auto 18px;border:2px solid rgba(139,156,255,.8);border-radius:24px;box-shadow:0 0 0 7px rgba(139,156,255,.08),0 16px 34px rgba(0,0,0,.2)}.monitor-sidebar h4{text-align:center;font-size:.92rem}.monitor-sidebar>p{text-align:center}.monitor-sidebar hr{border-color:var(--line)!important;margin:20px 0}.security-log{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.security-log small{letter-spacing:.12em;font-weight:800;font-size:.67rem;color:#8294b8}.status-badge{margin-top:10px;color:#7de6c0;font-size:.75rem}.status-badge i{font-size:7px;color:#42d6a4}
#exam-list-container{min-height:60vh}.message-box{position:relative;z-index:1;width:min(640px,calc(100% - 32px));margin:clamp(32px,8vh,90px) auto;padding:clamp(26px,5vw,52px);border:1px solid rgba(139,156,255,.28);border-radius:26px;background:linear-gradient(145deg,rgba(22,31,60,.96),rgba(10,16,33,.96));box-shadow:0 30px 100px rgba(0,0,0,.28);animation:examFadeUp .55s both}.message-box h1{color:#c3cbff;font-family:'Outfit',sans-serif;letter-spacing:-.04em}.message-box p{color:#a5b4d2;line-height:1.8}.message-box .btn{display:inline-block;text-decoration:none;margin-top:16px}#exam-results{border-color:rgba(66,232,212,.25)}#results-score{font-size:1.15rem;color:#e6f8ff}
@keyframes examFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes timerPulse{0%,100%{box-shadow:0 0 0 rgba(248,113,113,0)}50%{box-shadow:0 0 25px rgba(248,113,113,.15)}}
@media(max-width:900px){.exam-container{grid-template-columns:1fr;min-height:0}.monitor-sidebar{display:block;position:relative;top:auto;order:-1;display:grid;grid-template-columns:70px 1fr;gap:4px 16px;align-items:center;padding:14px 18px}.monitor-photo{width:64px;height:64px;grid-row:span 2;border-radius:18px;margin:0}.monitor-sidebar h4,.monitor-sidebar>p{text-align:left;margin:2px}.monitor-sidebar hr,.security-log{grid-column:1/-1}.security-log{display:flex;gap:10px 16px;flex-wrap:wrap}.security-log small{width:100%}.status-badge{margin:0}.question-area{padding:14px}.exam-header{padding:14px 18px}.exam-header a{font-size:.78rem!important}}
@media(max-width:560px){.exam-header{align-items:flex-start;flex-wrap:wrap}.exam-title{max-width:65%}.exam-header>a{margin-left:auto}.timer-box{width:100%;padding:7px 12px}.exam-container{padding:12px 10px 24px;gap:12px}.q-card{padding:18px 15px;border-radius:16px}.options label{padding:12px}.submit-btn,#submit-exam-btn{width:100%;min-width:0}.monitor-sidebar{grid-template-columns:56px 1fr;padding:12px}.monitor-photo{width:52px;height:52px}.security-log{gap:10px}.message-box{margin:24px auto;border-radius:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

    </style>
  </head>
  <body>
    <div id="exam-list-wrapper" style="display: none">
      <header class="exam-header">
        <div class="exam-title">
          <h3>Available Examinations</h3>
          <span id="student-id-tag-list" style="color: var(--gold)"
            >ID: VERIFIED</span
          >
        </div>
        <a
          href="./student-dashboard.html"
          style="color: white; text-decoration: none; font-size: 14px"
        >
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
      </header>
      <div class="question-area" id="exam-list-container">
        <!-- Exam list will be rendered here -->
      </div>
    </div>

    <div id="exam-wrapper" style="display: none">
      <header class="exam-header">
        <div class="exam-title">
          <h3 id="exam-title-display">Loading Exam...</h3>
          <span id="student-id-tag" style="color: var(--gold)"
            >ID: VERIFIED</span
          >
        </div>
        <div class="timer-box" id="timer">00:00</div>
      </header>

      <div class="exam-container">
        <main class="question-area">
          <div id="questions-container">
            <!-- Questions will be loaded here by JavaScript -->
            <div class="message-box" id="loading-message">
              <h1><i class="fas fa-spinner fa-spin"></i> Loading Exam...</h1>
              <p>Please wait while we prepare your questions.</p>
            </div>
          </div>
          <button class="submit-btn" id="submit-exam-btn" style="display: none">
            SUBMIT FINAL ANSWERS
          </button>
        </main>

        <aside class="monitor-sidebar">
          <img
            id="monitor-photo"
            src="https://via.placeholder.com/150"
            class="monitor-photo"
          />
          <h4>Student: <span id="s-name">Loading...</span></h4>
          <p>Class: <span id="s-class">...</span></p>
          <hr style="border-color: rgba(255, 255, 255, 0.1)" />
          <div class="security-log">
            <small>SECURITY STATUS</small>
            <span class="status-badge"
              ><i class="fas fa-circle"></i> Biometric Linked</span
            >
            <span class="status-badge"
              ><i class="fas fa-circle"></i> Timed Session</span
            >
            <span class="status-badge"
              ><i class="fas fa-circle"></i> Secure Submission</span
            >
          </div>
        </aside>
      </div>
    </div>

    <div class="message-box" id="exam-message" style="display: none">
      <h1 id="message-title"></h1>
      <p id="message-text"></p>
      <a href="./student-dashboard.html" class="btn">Return to Dashboard</a>
    </div>

    <!-- NEW: Post-Submission Results View -->
    <div class="message-box" id="exam-results" style="display: none">
      <h1 id="results-title"></h1>
      <p id="results-score"></p>
      <div id="results-actions" style="margin-top: 30px">
        <button id="review-answers-btn" class="submit-btn">
          Review Answers
        </button>
        <a
          href="./student-dashboard.html"
          class="submit-btn"
          style="
            background: #555;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
          "
          >Return to Dashboard</a
        >
      </div>
    </div>
    <script src="../shared/portal-client.js"></script>
    <script src="./exam-room.js"></script>
  </body>
</html>
