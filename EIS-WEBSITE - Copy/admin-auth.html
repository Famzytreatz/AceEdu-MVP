<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Secure Authentication</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --deep-navy: #0a192f;
        --cyber-blue: #00d2ff;
        --dark-surface: rgba(17, 34, 64, 0.9);
        --text-main: #e6f1ff;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Inter", "Segoe UI", sans-serif;
        background-color: var(--deep-navy);
      }

      .login-page-wrapper {
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(rgba(10, 25, 47, 0.8), rgba(10, 25, 47, 0.8)),
          url("school-bg.jpg") no-repeat center center fixed;
        background-size: cover;
      }

      .login-card {
        position: relative;
        background: var(--dark-surface);
        backdrop-filter: blur(15px);
        width: 90%;
        max-width: 400px;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgba(0, 210, 255, 0.2);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .portal-logo {
        width: 80px;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px var(--cyber-blue));
      }

      h1 {
        color: white;
        margin: 0;
        font-size: 22px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      p {
        color: var(--cyber-blue);
        font-size: 14px;
        margin-top: 5px;
        opacity: 0.8;
      }

      #adminPassword {
        width: 100%;
        box-sizing: border-box;
        padding: 15px;
        margin: 25px 0;
        background: rgba(2, 12, 27, 0.7);
        border: 1px solid rgba(255, 82, 82, 0.4); /* Red tint for admin */
        border-radius: 12px;
        font-size: 16px;
        color: #ff5252; /* Red tint for admin */
        text-align: center;
        transition: 0.3s;
      }

      #adminPassword:focus {
        outline: none;
        border-color: #ff5252;
        box-shadow: 0 0 15px rgba(255, 82, 82, 0.3);
      }

      .login-btn {
        width: 100%;
        padding: 15px;
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
        text-transform: uppercase;
      }
      .login-btn:hover {
        background: #c0392b;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
      }
      .footer-note {
        margin-top: 20px;
        font-size: 11px;
        color: #8892b0;
      }
    </style>
  </head>
  <body>
    <div class="login-page-wrapper">
      <div class="login-card">
        <div class="login-header">
          <img src="/logo.png" alt="Logo" class="portal-logo" />
          <h1>Admin Vault</h1>
          <p>Enter Master Password</p>
        </div>

        <div class="login-body">
          <input
            type="password"
            id="adminPassword"
            placeholder="••••••••••••••••"
          />
          <button class="login-btn" onclick="verifyAdminPassword()">
            Access Control Panel
          </button>
        </div>
        <div class="footer-note">
          Unauthorized access is strictly prohibited.
        </div>
      </div>
    </div>

    <script>
      function verifyAdminPassword() {
        const password = document.getElementById("adminPassword").value;
        // IMPORTANT: This is a client-side check and is not secure for production.
        // For a real application, this password check should happen on the server.
        const MASTER_PASSWORD = "SuperAdminPassword123!";

        if (password === MASTER_PASSWORD) {
          window.location.href = "/admin"; // Redirect to the actual admin panel
        } else {
          alert("Incorrect Password. Access Denied.");
          document.getElementById("adminPassword").value = ""; // Clear input
        }
      }

      // Enter key support
      document
        .getElementById("adminPassword")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            verifyAdminPassword();
          }
        });
    </script>
  </body>
</html>
