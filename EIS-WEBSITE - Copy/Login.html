<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliud International School | Secure Access</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --deep-navy: #0a192f;
        --cyber-blue: #00d2ff;
        --dark-surface: rgba(17, 34, 64, 0.9);
        --text-main: #e6f1ff;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Inter", "Segoe UI", sans-serif;
        background-color: var(--deep-navy);
      }

      .login-page-wrapper {
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(rgba(10, 25, 47, 0.8), rgba(10, 25, 47, 0.8)),
          url("school-bg.jpg") no-repeat center center fixed;
        background-size: cover;
      }

      .login-card {
        position: relative;
        background: var(--dark-surface);
        backdrop-filter: blur(15px);
        width: 90%;
        max-width: 400px;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgba(0, 210, 255, 0.2);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .portal-logo {
        width: 80px;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px var(--cyber-blue));
      }

      h1 {
        color: white;
        margin: 0;
        font-size: 22px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      p {
        color: var(--cyber-blue);
        font-size: 14px;
        margin-top: 5px;
        opacity: 0.8;
      }

      #accessCode {
        width: 100%;
        box-sizing: border-box;
        padding: 15px;
        margin: 25px 0;
        background: rgba(2, 12, 27, 0.7);
        border: 1px solid rgba(0, 210, 255, 0.3);
        border-radius: 12px;
        font-size: 16px;
        color: var(--cyber-blue);
        text-align: center;
        transition: 0.3s;
      }

      #accessCode:focus {
        outline: none;
        border-color: var(--cyber-blue);
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
      }

      .login-btn {
        width: 100%;
        padding: 15px;
        background: var(--cyber-blue);
        color: var(--deep-navy);
        border: none;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
        text-transform: uppercase;
      }

      .login-btn:hover {
        background: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
      }

      .footer-note {
        margin-top: 20px;
        font-size: 11px;
        color: #8892b0;
      }

      /* Added style for the scan button you included */
      .scan-trigger-btn {
        background: transparent;
        border: 1px solid var(--cyber-blue);
        color: var(--cyber-blue);
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="login-page-wrapper">
      <div class="login-card">
        <div class="login-header">
          <img src="/logo.png" alt="Logo" class="portal-logo" />
          <h1>Eliud International School</h1>
          <p>Student Academic Portal</p>
        </div>

        <button type="button" onclick="openScanner()" class="scan-trigger-btn">
          <i class="fas fa-qrcode"></i> Use Digital ID Scan
        </button>

        <div class="login-body">
          <input
            type="text"
            id="accessCode"
            placeholder="Enter Personal Access Code"
          />
          <button class="login-btn" onclick="loginWithCode()">
            Initialize Dashboard
          </button>
        </div>
        <div class="footer-note">Secure Identity & Learning Environment</div>
      </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
      // SCANNER LOGIC
      function openScanner() {
        const width = 400;
        const height = 500;
        const left = window.innerWidth / 2 - width / 2;
        const top = window.innerHeight / 2 - height / 2;
        window.open(
          "scanner.html",
          "Scanner",
          `width=${width},height=${height},top=${top},left=${left}`,
        );
      }

      window.addEventListener("message", function (event) {
        if (event.data.type === "QR_SCANNED") {
          const pinInput = document.getElementById("accessCode");
          pinInput.value = event.data.pin;
          loginWithCode();
        }
      });

      // LOGIN LOGIC
      async function loginWithCode() {
        const pinValue = document.getElementById("accessCode").value.trim();

        if (!pinValue) {
          alert("Identity verification required. Please enter your code.");
          return;
        }

        // New: Check for special admin access code
        if (pinValue.toUpperCase() === "ADMINVAULT") {
          // Redirect to a new password-protected admin auth page
          window.location.href = "/admin-auth";
          return; // Stop further execution
        }

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin: pinValue }),
          });

          const data = await response.json();

          if (data.success) {
            // --- THE IDENTITY INSTALLATION FIX ---
            const identityData = {
              fullName: data.userName,
              accessPin: data.pin,
              // If your server doesn't send designation yet, we default to SS3 Science
              designation: data.designation || "SS3 Science",
              passport: data.passport || "/logo.png",
              role: data.role
            };

            // Save both keys to be safe
            localStorage.setItem("userPin", pinValue);
            localStorage.setItem("userRole", data.role);
            localStorage.setItem("adminName", data.userName);
            localStorage.setItem(
              "studentIdentity",
              JSON.stringify(identityData),
            );

            window.location.href = data.redirectUrl;
          } else {
            alert(data.message || "Invalid Code. Access Denied.");
          }
        } catch (error) {
          console.error("Login Error:", error);
          alert("Vault connection failed. Ensure your server is running.");
        }
      }

      // Enter key support
      document
        .getElementById("accessCode")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") loginWithCode();
        });
    </script>
  </body>
</html>
