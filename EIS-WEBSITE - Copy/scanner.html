<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eliud Security | Identity Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            background: var(--dark);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Tactical Scanner Header */
        .scanner-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--gold);
            background: linear-gradient(to bottom, #1a1a1a, var(--dark));
        }

        .scanner-header h2 {
            color: var(--gold);
            letter-spacing: 2px;
            margin: 0;
            font-size: 1.2rem;
        }

        /* Camera Viewport */
        #reader {
            flex: 1;
            width: 100% !important;
            border: none !important;
        }

        /* Tactical Overlay */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
            pointer-events: none;
            border-radius: 20px;
        }

        .overlay::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--gold);
            top: 0;
            animation: scan 2s infinite linear;
            box-shadow: 0 0 15px var(--gold);
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Result Popup */
        #result-popup {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #151515;
            border-top: 3px solid var(--gold);
            padding: 30px 20px;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            text-align: center;
        }

        #result-popup.active { bottom: 0; }

        .status-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .access-granted { color: #2ecc71; }
        .access-denied { color: #e74c3c; }

        .btn-reset {
            background: var(--gold);
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="scanner-header">
        <h2><i class="fas fa-shield-alt"></i> ELIUD INTERNATIONAL SCHOOL SECURITY</h2>
        <p style="font-size: 10px; opacity: 0.6;">SCAN IDENTITY QR CODE</p>
    </div>

    <div id="reader"></div>
    <div class="overlay"></div>

    <div id="result-popup">
        <div id="status-content">
            <div class="status-icon access-granted"><i class="fas fa-check-circle"></i></div>
            <h1 id="resName">Mrs Heather MohMoh</h1>
            <p id="resRole" style="color: var(--gold); font-weight: bold;">STUDENT</p>
            <p id="resStatus">Access Granted • Active Identity</p>
        </div>
        <button class="btn-reset" onclick="resetScanner()">NEXT SCAN</button>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const popup = document.getElementById('result-popup');

        const qrConfig = { fps: 10, qrbox: { width: 250, height: 250 } };

     function onScanSuccess(decodedText, decodedResult) {
    // 1. Send the PIN back to the Login page
    window.opener.postMessage({
        type: 'QR_SCANNED',
        pin: decodedText
    }, "*");

    // 2. Play a success sound or visual feedback
    console.log(`ID Identified: ${decodedText}`);

    // 3. Close the scanner window automatically
    window.close();
}

        async function verifyIdentity(pin) {
            try {
                // We'll create this simple endpoint next
                const response = await fetch(`/api/verify-pin/${pin}`);
                const data = await response.json();

                if(data.found) {
                    document.getElementById('resName').innerText = data.user.fullName;
                    document.getElementById('resRole').innerText = data.user.role.toUpperCase();
                    popup.classList.add('active');
                    // Play success sound if desired
                } else {
                    alert("⚠️ VOID IDENTITY: PIN NOT FOUND");
                    resetScanner();
                }
            } catch (err) {
                alert("Network Error");
                resetScanner();
            }
        }

        function resetScanner() {
            popup.classList.remove('active');
            html5QrCode.resume();
        }

        // Start Camera
        html5QrCode.start({ facingMode: "environment" }, qrConfig, onScanSuccess);
    </script>
</body>
</html>
