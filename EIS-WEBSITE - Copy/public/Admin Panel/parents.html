<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Portal | Info Hub</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #fdfdfd; }
        .mobile-header { background: #0047AB; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .login-box { padding: 40px 20px; text-align: center; }
        input { width: 80%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        .btn-login { background: #0047AB; color: white; border: none; padding: 15px 30px; border-radius: 10px; margin-top: 10px; width: 80%; font-weight: bold; }
        
        .event-card { background: white; margin: 15px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #D4AF37; }
        .event-date { color: #0047AB; font-weight: bold; font-size: 14px; }
    </style>
    
</head>
<body>
    

    <div id="parentLoginView" class="login-box">
        <h2 style="color:#0047AB">Parent Access</h2>
        <p>Enter your registered phone number to view school updates.</p>
        <input type="text" id="parentPhone" placeholder="e.g. 08012345678">
        <button class="btn-login" onclick="parentLogin()">Access Portal</button>
    </div>

    <div id="parentInfoView" style="display:none;">
        <div class="mobile-header">
            <h3 id="pWelcome">Welcome</h3>
            <p>Upcoming School Events</p>
        </div>
        <div id="eventList">
            </div>
    </div>
    
    <button onclick="publishNewsletter()" style="background:var(--navy); color:var(--gold); padding:10px 20px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">
        Broadcast to Parents
    </button>
</div>
<div style="padding: 20px;">
    <h3 style="color:#0047AB; border-bottom: 2px solid #D4AF37; padding-bottom: 10px;">Dear Esteemed Parents this Official Portal is only opened to users registered by The Admin of Eliud International School</h3>
</div>


<script>
async function loadNewsletters() {
    const response = await fetch('http://localhost:3000/api/newsletters');
    const newsData = await response.json();
    const list = document.getElementById('newsletterList');
    
    list.innerHTML = newsData.map(item => `
        <div style="background:white; padding:15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
            <div>
                <strong style="display:block;">${item.title}</strong>
                <small style="color:#888;">Published: ${new Date(item.publishDate).toLocaleDateString()}</small>
            </div>
            <a href="${item.downloadLink}" target="_blank" style="background:#0047AB; color:white; padding:8px 15px; border-radius:5px; text-decoration:none; font-size:12px;">
                📥 Download
            </a>
        </div>
    `).join('');
}

// Call this inside your successful parent login function
// loadNewsletters();
</script>

    <script>
        async function parentLogin() {
            const phone = document.getElementById('parentPhone').value;
            const response = await fetch('http://localhost:3000/parent/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('parentLoginView').style.display = 'none';
                document.getElementById('parentInfoView').style.display = 'block';
                document.getElementById('pWelcome').innerText = `Hello, ${data.parentName}`;
                loadEvents();
            } else {
                alert("This phone number is not registered. Please contact the school admin.");
            }
        }

        async function loadEvents() {
            const response = await fetch('http://localhost:3000/api/events');
            const events = await response.json();
            const list = document.getElementById('eventList');
            list.innerHTML = events.map(ev => `
                <div class="event-card">
                    <div class="event-date">📅 ${ev.date}</div>
                    <h3 style="margin:5px 0;">${ev.title}</h3>
                    <p style="color:#666;">${ev.description}</p>
                </div>
            `).join('');
        }
        // Function to register a parent (Admin Only)
async function registerParent() {
    const parentData = {
        parentName: document.getElementById('adminPName').value,
        phoneNumber: document.getElementById('adminPPhone').value,
        studentName: document.getElementById('adminPChild').value
    };

    await fetch('http://localhost:3000/admin/add-parent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(parentData)
    });
    alert("Parent Authorized!");
}


// Function to post a school event (Admin Only)
async function postSchoolEvent() {
    const eventData = {
        title: document.getElementById('eventTitle').value,
        date: document.getElementById('eventDate').value,
        description: document.getElementById('eventDesc').value
    };

    await fetch('http://localhost:3000/admin/add-event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(eventData)
    });
    alert("Event Posted to Parent Portal!");
}
    </script>
    
</body>
</html>
