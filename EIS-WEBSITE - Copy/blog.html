<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliud Academy | Live Social</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="insta-body">

    <nav class="insta-nav">
        <div class="nav-content">
             <img src="logo.png" class="mini-logo">
             <span class="insta-logo-text">Eliud Feed</span>
             <div class="nav-icons">
                 <a href="https://www.instagram.com/eliudschoolportharcourt" target="_blank"><i class="fa fa-instagram"></i></a>
             </div>
        </div>
    </nav>

    <main class="live-insta-container">
        <div class="widget-wrapper">
            <iframe src="https://snapwidget.com/embed/YOUR_WIDGET_ID" 
                    class="snapwidget-widget" 
                    allowtransparency="true" 
                    frameborder="0" 
                    scrolling="no" 
                    style="border:none; overflow:hidden; width:100%; height: 100vh;">
            </iframe>
        </div>
    </main>

    <div class="insta-bottom-nav">
        <a href="index.html"><i class="fa fa-home"></i></a>
        <a href="blog.html" class="active"><i class="fa fa-compass"></i></a>
        <a href="enroll.html"><i class="fa fa-plus-square-o"></i></a>
        <a href="login.html"><i class="fa fa-user-circle-o"></i></a>
    </div>

</body>
</html>
